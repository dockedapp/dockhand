server:
  # Port the runner listens on. Default: 7777
  port: 7777

  # API key for authenticating requests from Docked.
  # Leave empty to auto-generate on first run (key is printed to stdout
  # and persisted to /var/lib/dockhand/.api_key).
  # Override with env var: DOCKHAND_API_KEY
  api_key: ""

  # Enable TLS (self-signed cert auto-generated). Default: false
  tls: false

runner:
  # Display name shown in the Docked UI.
  # Defaults to the system hostname. Override with: DOCKHAND_NAME
  name: "my-host"

  # Optional: URL of your Docked server. When set, the runner will
  # announce itself on startup so you don't have to add it manually.
  # docked_url: "http://docked:3000"

docker:
  # Set to false to disable Docker container management entirely.
  enabled: true

  # Unix socket path. Default: /var/run/docker.sock
  # When running inside a container, mount the host socket:
  #   -v /var/run/docker.sock:/var/run/docker.sock
  socket: "/var/run/docker.sock"

  # "docker" uses the Compose v2 plugin (docker compose ...).
  # "docker-compose" uses the standalone v1 binary.
  compose_binary: "docker"

# Named operations — command templates the runner can execute.
# These are defined on the HOST (never exposed through the UI).
# The UI only sees the name and description; the command stays here.
#
# operations:
#   update:
#     command: "bash /opt/update.sh"
#     description: "Update this service to the latest version"
#     timeout: 300        # seconds (default: 300)
#     working_dir: "/"    # working directory for the command
#
#   restart:
#     command: "systemctl restart myapp"
#     description: "Restart the service"
#     timeout: 30

# Apps — named managed services surfaced in the Docked UI. Each app can report a
# count of pending OS package updates for its host/LXC.
#
# apps:
#   myhost:
#     description: "Ubuntu host"
#
#     # Version tracking — detect current and latest versions.
#     version_command: "myapp --version"        # shell command that prints current version
#     version_source:
#       type: github                            # "github" or "command"
#       repo: "owner/repo"                      # (github) latest release tag
#       # command: "curl -s https://example.com/latest"  # (command) shell command that prints latest version
#
#     # OS update reporting — choose ONE of the two options below.
#
#     # Option A (recommended for Debian/Ubuntu): built-in apt checker. Unlike a
#     # freeform command, it refreshes the package index itself so counts never
#     # go stale. Requires the runner to run as root.
#     system_updates:
#       type: apt              # only "apt" is supported for now
#       refresh_interval: 6h   # how often to run "apt-get update"; default 6h, min 15m
#
#     # Option B: freeform command that prints the number of upgradable packages
#     # to stdout. Use for non-apt systems. NOTE: most such commands only read the
#     # local package cache — schedule your own index refresh (e.g. a cron
#     # "apt-get update") or counts will be stale. If both options are set, the
#     # built-in checker wins and this command is ignored (a warning is logged).
#     # system_update_check: "apt list --upgradable 2>/dev/null | grep -cF '[upgradable' || true"
#
#     operations:
#       update:
#         label: "Update packages"
#         command: "apt-get -y dist-upgrade"
#         timeout: 600
